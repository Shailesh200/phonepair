<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="PhonePair Helper">
  <defs>
    <linearGradient id="bg" x1="200" y1="120" x2="820" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A281F"/>
      <stop offset="0.42" stop-color="#2A1C16"/>
      <stop offset="1" stop-color="#1C130E"/>
    </linearGradient>
    <linearGradient id="sheen" x1="512" y1="108" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F0E6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F6F0E6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Squircle, ~22% corner radius, inset for the Apple icon safe area. -->
  <rect x="108" y="108" width="808" height="808" rx="178" fill="url(#bg)"/>
  <rect x="108" y="108" width="808" height="808" rx="178" fill="url(#sheen)"/>
  <rect x="110" y="110" width="804" height="804" rx="176" fill="none" stroke="#F6F0E6" stroke-opacity="0.12" stroke-width="3"/>
  <!-- Laptop and phone stay separated by a dark gap so both read at 16px. -->
  <rect x="200" y="456" width="360" height="200" rx="28" fill="#F6F0E6"/>
  <rect x="176" y="652" width="408" height="52" rx="16" fill="#F6F0E6"/>
  <rect x="668" y="300" width="168" height="404" rx="36" fill="#F6F0E6"/>
  <!-- Spark in the gap, large enough to survive 16px. -->
  <path d="M584 292l28 52 52 28-52 28-28 52-28-52-52-28 52-28z" fill="#C4A06A"/>
</svg>
