name: Helper release

on:
  workflow_dispatch:
  push:
    tags:
      - 'helper-v*'

jobs:
  release-mac:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test helper
        working-directory: helper
        run: npm ci && npm run build && npm test

      - name: Test desktop
        working-directory: desktop
        run: npm ci && npm test

      - name: Detect signing secret
        id: sign
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
        run: |
          set -euo pipefail
          if [ -n "${CSC_LINK_SECRET}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "CSC_LINK is set. The Mac build will be signed and notarized."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CSC_LINK is empty. Building unsigned (CSC_IDENTITY_AUTO_DISCOVERY=false)."
          fi

      - name: Prepare Apple signing credentials
        if: steps.sign.outputs.enabled == 'true'
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BODY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK_SECRET:-}" ] || [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo "Missing CSC_LINK or CSC_KEY_PASSWORD secret" >&2
            exit 1
          fi
          if [ -z "${APPLE_API_KEY_BODY:-}" ] || [ -z "${APPLE_API_KEY_ID:-}" ] || [ -z "${APPLE_API_ISSUER:-}" ]; then
            echo "Missing APPLE_API_KEY, APPLE_API_KEY_ID, or APPLE_API_ISSUER secret" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP"
          export P12_FILE="$RUNNER_TEMP/developer-id.p12"
          python3 desktop/scripts/decode-csc-link.py
          openssl pkcs12 -in "$P12_FILE" -nokeys -passin env:CSC_KEY_PASSWORD >/dev/null 2>/dev/null \
            || openssl pkcs12 -in "$P12_FILE" -nokeys -legacy -passin env:CSC_KEY_PASSWORD >/dev/null

          export KEY_FILE="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          python3 -c 'import os, pathlib; b=os.environ["APPLE_API_KEY_BODY"].replace("\\n","\n"); p=pathlib.Path(os.environ["KEY_FILE"]); p.write_text(b if b.endswith("\n") else b+"\n")'
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_FILE"; then
            echo "APPLE_API_KEY does not look like a .p8 PEM (missing BEGIN PRIVATE KEY)" >&2
            exit 1
          fi
          echo "Checking notarytool credentials (fails fast if the API key or Apple agreements are wrong)..."
          xcrun notarytool history --key "$KEY_FILE" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"

          {
            echo "CSC_LINK=$P12_FILE"
            echo "APPLE_API_KEY=$KEY_FILE"
          } >> "$GITHUB_ENV"

      - name: Build signed macOS artifacts
        if: steps.sign.outputs.enabled == 'true'
        timeout-minutes: 90
        working-directory: desktop
        run: npx electron-builder --mac --publish never
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ARDSWV5GD2
          DEBUG: electron-osx-sign*,electron-notarize*

      - name: Build unsigned macOS artifacts
        if: steps.sign.outputs.enabled != 'true'
        timeout-minutes: 90
        working-directory: desktop
        run: npx electron-builder --mac --publish never -c.mac.identity=- -c.mac.notarize=false -c.dmg.sign=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Show macOS code signature
        run: |
          set -euo pipefail
          app="$(find desktop/release -type d -name '*.app' -print -quit)"
          if [ -z "${app}" ]; then
            echo "No .app was produced" >&2
            exit 1
          fi
          echo "codesign -dv --verbose=4 ${app}"
          codesign -dv --verbose=4 "${app}" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          if [ "${{ steps.sign.outputs.enabled }}" != "true" ]; then
            grep -E -q 'Signature=adhoc|adhoc' "$RUNNER_TEMP/codesign.txt"
          fi

      - name: Upload macOS builds
        uses: actions/upload-artifact@v4
        with:
          name: phonepair-helper-mac
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap

  release-win:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test helper
        working-directory: helper
        shell: bash
        run: npm ci && npm run build && npm test

      - name: Test desktop
        working-directory: desktop
        shell: bash
        run: npm ci && npm test

      # CSC_LINK from PortPilot is a Developer ID p12, not an Authenticode
      # certificate, so the Windows installer is always unsigned.
      - name: Build Windows installer
        working-directory: desktop
        shell: bash
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: phonepair-helper-win
          if-no-files-found: error
          path: desktop/release/*.exe

  publish-release:
    needs: [release-mac, release-win]
    if: startsWith(github.ref, 'refs/tags/helper-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No build artifacts to publish" >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$tag" --notes "PhonePair Helper ${tag}"
          fi
